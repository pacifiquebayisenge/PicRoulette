name: Version bump

on:
  push:
    branches:
      - dev

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # keep default persist-credentials: true so semantic-release can push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # If you use npm:
      - name: Install dependencies
        run: npm ci

      # If you use yarn instead, swap the step above with:
      # - name: Install dependencies
      #   run: yarn install --frozen-lockfile

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}