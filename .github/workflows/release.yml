name: Version bump

on:
  push:
    branches:
      - dev

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # keep default persist-credentials: true so semantic-release can push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"        
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Force npmjs registry (hard)
        run: |
          rm -f ~/.npmrc
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          echo "registry now => $(npm config get registry)"
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Debug npm config
        run: |
          echo "NPM_CONFIG_REGISTRY=$NPM_CONFIG_REGISTRY"
          npm config get registry
          npm config get userconfig
          npm config list -l | sed -n '1,120p'
          echo "---- repo .npmrc ----"
          (test -f .npmrc && cat .npmrc) || echo "no .npmrc"
          echo "---- home .npmrc ----"
          (test -f ~/.npmrc && cat ~/.npmrc) || echo "no ~/.npmrc"

      # If you use npm:
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund --loglevel=verbose
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      # If you use yarn instead, swap the step above with:
      # - name: Install dependencies
      #   run: yarn install --frozen-lockfile

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}